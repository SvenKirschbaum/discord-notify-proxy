name: Release Native Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: registry.gitlab.com/fallobst22/images/discord-notify-proxy

jobs:
  build-and-publish:
    name: Build and Publish Native Image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build native OCI image
        run: >-
          ./mvnw -B -Pnative spring-boot:build-image
          -Dspring-boot.build-image.imageName=${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Smoke test built image
        env:
          APP_DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN_SMOKETEST }}
        run: ./.github/scripts/smoke-test-image.sh ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}

      - name: Push native OCI image tags
        run: |
          primary_image="${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker tag "$primary_image" "$tag"
            docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'

      - name: Scan published image
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:main-${{ github.run_number }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
