name: Release Native Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  IMAGE: discord-notify-proxy
  IMAGE_NAME: registry.gitlab.com/fallobst22/images/discord-notify-proxy

jobs:
  build-and-publish:
    name: Build and Publish Native Image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build native OCI image
        run: >-
          ./mvnw -B -Pnative spring-boot:build-image
          -Dspring-boot.build-image.imageName=${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Smoke test built image
        env:
          APP_DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN_SMOKETEST }}
        run: ./.github/scripts/smoke-test-image.sh ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USERNAME }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}

      - name: Push native OCI image tags
        run: |
          primary_image="${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker tag "$primary_image" "$tag"
            docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'

      - name: Trigger Flux image scans
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URLS: ${{ secrets.FLUX_IMAGE_WEBHOOK_URLS }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK_URLS}" ]]; then
            echo "No Flux image webhook URLs configured; skipping."
            exit 0
          fi

          oidc_token="$(
            curl -fsSL \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=notification-controller" \
              | jq -r '.value'
          )"
          payload="$(jq -cn --arg image "${IMAGE}" '{images: [$image]}')"

          while IFS= read -r webhook_url; do
            if [[ -z "${webhook_url}" ]]; then
              continue
            fi

            echo "Calling Flux image webhook: ${webhook_url}"
            if [[ "${webhook_url}" =~ ^([^:]+)://([^/?#]+) ]]; then
              echo "Flux image webhook endpoint: ${BASH_REMATCH[1]}://${BASH_REMATCH[2]}"
            fi

            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${oidc_token}" \
              -H "Content-Type: application/json" \
              --data "${payload}" \
              "${webhook_url}"
          done <<< "${WEBHOOK_URLS}"

      - name: Scan published image
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:main-${{ github.run_number }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
